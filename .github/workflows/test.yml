name: Tests
on: [push, pull_request]
jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest beautifulsoup4
      - run: python -m compileall -q custom_components tests
      - run: pytest -q tests
